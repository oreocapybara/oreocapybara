name: Generate stats card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=oreocapybara&hide_title=true&show_icons=true&include_all_commits=true&count_private=true&theme=material-palenight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit and push stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update stats card" || exit 0
          git push
